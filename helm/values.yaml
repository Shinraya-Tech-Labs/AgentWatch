# Default values for panoptis chart.
replicaCount: 2

image:
  repository: ghcr.io/sreerevanth/panoptis
  tag: "0.2.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: nginx
  hosts:
    - host: panoptis.local
      paths:
        - path: /
          pathType: Prefix

# Name of an existing Secret holding AGENTWATCH_API_KEY, DATABASE_URL, AGENTWATCH_STORE and
# REDIS_URL. Required: the chart does not render without it, and no password lives here.
secrets:
  existingSecret: ""

postgres:
  enabled: true
  database: panoptis
  username: panoptis
  # the password is part of DATABASE_URL in secrets.existingSecret; there is no default
  size: 10Gi

redis:
  enabled: true

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

env:
  AGENTWATCH_ENV: production

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
