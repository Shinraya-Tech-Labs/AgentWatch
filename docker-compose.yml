services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: panoptis
      POSTGRES_USER: panoptis
      POSTGRES_PASSWORD: panoptis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panoptis"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql+asyncpg://panoptis:panoptis@postgres:5432/panoptis
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      AGENTWATCH_ENV: production
      # production refuses to start without a key; set it in .env (see .env.example)
      AGENTWATCH_API_KEY: ${AGENTWATCH_API_KEY:?set AGENTWATCH_API_KEY in .env - see .env.example}
      # v3 evidence store: on the Postgres service, whose volume persists (otherwise it would
      # be SQLite inside the container and lost when the container is recreated)
      AGENTWATCH_STORE: postgresql+psycopg://panoptis:panoptis@postgres:5432/panoptis
      # payloads over 64 KB are stored as files; keep them on a volume
      AGENTWATCH_BLOB_DIR: /data/blobs
    volumes:
      - panoptis_blobs:/data/blobs
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://panoptis:panoptis@postgres:5432/panoptis
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["workers"]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      AGENTWATCH_API_URL: http://api:8000
      # the server-side proxy attaches this key; the browser never sees it
      AGENTWATCH_API_KEY: ${AGENTWATCH_API_KEY:?set AGENTWATCH_API_KEY in .env - see .env.example}
      NEXT_PUBLIC_API_URL: /api/v1
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.60
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    profiles: ["tracing"]
    restart: unless-stopped

volumes:
  postgres_data:
  panoptis_blobs:

networks:
  default:
    name: panoptis-network
