name: AgentWatch CI

on:
  push:
    branches: [main, develop, architecture/v3]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ─── Python lint + type-check ─────────────────────────────────────────────
  python-lint:
    name: Python Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        run: pip install ruff mypy pydantic && pip install -e .
      - name: Ruff lint
        run: ruff check agentwatch/
      - name: Ruff format check
        run: ruff format --check agentwatch/
      - name: Type check (v3 modules)
        run: make typecheck

  # ─── Python unit tests ────────────────────────────────────────────────────
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: agentwatch_test
          POSTGRES_USER: agentwatch
          POSTGRES_PASSWORD: agentwatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run unit tests
        env:
          DATABASE_URL: postgresql+asyncpg://agentwatch:agentwatch@localhost:5432/agentwatch_test
          REDIS_URL: redis://localhost:6379/0
          AGENTWATCH_TEST_PG_URL: postgresql+psycopg://agentwatch:agentwatch@localhost:5432/agentwatch_test
        run: pytest tests/ -v --cov=agentwatch --cov-report=xml --cov-report=html --cov-report=term-missing --cov-fail-under=70
      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: html-coverage-report
          path: htmlcov/
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  # ─── Integration tests ────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [python-tests]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: agentwatch_test
          POSTGRES_USER: agentwatch
          POSTGRES_PASSWORD: agentwatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://agentwatch:agentwatch@localhost:5432/agentwatch_test
          REDIS_URL: redis://localhost:6379/0
        run: pytest tests/integration/ -v

  # ─── Frontend build ───────────────────────────────────────────────────────
  frontend-build:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Type check
        run: npm run type-check
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: /api/v1

  # ─── Docker build ─────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [python-tests, frontend-build]
    # build (never push) on every push, so release branches are validated before they merge
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: false
          tags: agentwatch/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: false
          tags: agentwatch/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Compose smoke test ───────────────────────────────────────────────────
  # Builds and starts postgres + redis + api + frontend exactly as docker-compose.yml defines
  # them and checks the running stack: health, key enforcement, a v3 round trip on the
  # Postgres store, and the frontend proxy attaching the key server-side. Building images
  # alone did not catch an API that could not start.
  compose-smoke:
    name: Compose Smoke Test
    runs-on: ubuntu-latest
    needs: [python-tests]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Start the stack
        run: |
          echo "AGENTWATCH_API_KEY=ci-compose-smoke-key" > .env
          docker compose up -d --build --wait --wait-timeout 420 api frontend
      - name: Check the running API
        run: |
          pip install -q -e .
          python - <<'EOF'
          import httpx
          from agentwatch import instrument as aw
          from agentwatch.sensors.base import ListSink

          base, key = "http://localhost:8000", {"X-Api-Key": "ci-compose-smoke-key"}
          assert httpx.get(f"{base}/health", timeout=10).status_code == 200
          assert httpx.get(f"{base}/api/v3/status", timeout=10).status_code == 401
          status = httpx.get(f"{base}/api/v3/status", headers=key, timeout=30).json()
          assert status["store_backend"] == "postgresql", status
          sink = ListSink()
          aw.configure(sink)
          with aw.run("compose-smoke"):
              with aw.span("TOOL_INVOCATION", "ping") as s:
                  s.input("x").output("y")
          body = {"observations": [d.to_dict() for d in sink.drafts]}
          r = httpx.post(f"{base}/api/v3/observations", json=body, headers=key, timeout=30)
          assert r.status_code == 200 and r.json()["accepted"] == len(body["observations"]), r.text
          runs = httpx.get(f"{base}/api/v3/runs", headers=key, timeout=60).json()["runs"]
          assert any(x["name"] == "compose-smoke" for x in runs), runs
          # the frontend: its page renders, and its proxy reaches /api/v3 with the key attached
          # (the browser sends none)
          ui = "http://localhost:3000"
          assert httpx.get(f"{ui}/", timeout=30).status_code == 200
          proxied = httpx.get(f"{ui}/api/v3/runs", timeout=60)
          assert proxied.status_code == 200, proxied.text
          assert any(x["name"] == "compose-smoke" for x in proxied.json()["runs"])
          # a payload over the 64 KB inline limit (stored as a blob), kept for after the restart
          sink.drafts.clear()
          with aw.run("compose-smoke-large"):
              with aw.span("TOOL_INVOCATION", "big") as s:
                  s.output("x" * 100_000)
          body = {"observations": [d.to_dict() for d in sink.drafts]}
          r = httpx.post(f"{base}/api/v3/observations", json=body, headers=key, timeout=30)
          assert r.status_code == 200, r.text
          open("large_obs_ids.txt", "w").write("\n".join(r.json()["obs_ids"]))
          print("compose smoke test passed")
          EOF
      - name: Large payloads survive an API restart
        run: |
          docker compose restart api
          docker compose up -d --wait --wait-timeout 180 api
          python - <<'EOF'
          import httpx

          base, key = "http://localhost:8000", {"X-Api-Key": "ci-compose-smoke-key"}
          ids = open("large_obs_ids.txt").read().split()
          found = False
          for obs_id in ids:
              r = httpx.get(f"{base}/api/v3/observations/{obs_id}", headers=key, timeout=30)
              assert r.status_code == 200, r.text
              if "x" * 100_000 in r.text:
                  found = True
          assert found, "the large payload did not survive the restart"
          print("large payload survived the restart")
          EOF
      - name: API logs on failure
        if: failure()
        run: docker compose logs api frontend
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  # ─── Security scan ────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pip-audit
        run: |
          pip install -e ".[crypto]"
          pip install pip-audit
      - name: Audit dependencies
        run: pip-audit --desc
        continue-on-error: true

  # ─── Landing build ────────────────────────────────────────────────────────
  landing-build:
    name: Landing Page Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: agentwatch-landing/package-lock.json
      - name: Install deps
        run: npm ci
        working-directory: agentwatch-landing
      - name: Build
        # next/font downloads Google Fonts at build time; that fetch fails intermittently on
        # runners. Retry once — a real build error fails both attempts.
        run: |
          npm run build || { echo "::warning::landing build failed, retrying once (font fetch)"; sleep 20; npm run build; }
        working-directory: agentwatch-landing
