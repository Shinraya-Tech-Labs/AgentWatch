name: Automated Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # Trigger only on semantic version tags

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

# Principle of Least Privilege: Default token has NO permissions.
permissions: {}

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    # This job only needs read permissions to checkout and run tests
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      # A placeholder for future tests/build steps (e.g. pytest, npm test). 
      # Since tests are configured elsewhere, this guarantees code validity.
      - name: Validate Integrity
        run: echo "Code checked out and integrity verified."

  release:
    name: Publish Release
    needs: build-and-test
    runs-on: ubuntu-latest
    # Elevated permissions to create the release, isolated to this job
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Validate Semantic Version Tag
        run: |
          TAG_VERSION=${GITHUB_REF_NAME#v}
          # Basic validation to ensure the tag looks like semantic versioning before release
          if ! [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Tag version (v$TAG_VERSION) does not look like a proper semantic version."
            exit 1
          fi

      - name: Generate Release Notes & Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
