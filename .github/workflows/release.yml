name: Release

# The single release path (TO-033). A vMAJOR.MINOR.PATCH tag on a commit of main runs:
#   1. the full CI (lint, types, Bandit, tests with Postgres/Redis, coverage floors, clean
#      install + pip-audit, frontend, Docker, compose smoke, secret scan) on the tag commit;
#   2. the release gates (tag = pyproject version, CHANGELOG section, commit on main);
#   3. one build of the wheel and sdist, content checks, SHA256SUMS, provenance attestation;
#   4. PyPI publication of exactly those files (re-verified against SHA256SUMS);
#   5. the GitHub Release with the same files.
# Any failure stops everything after it. A manual run with dry_run=true does 1-3 only.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to verify (e.g. v0.3.1); the run checks it out"
        required: true
      dry_run:
        description: "Verify and build only; publish nothing"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  ci:
    name: Full CI on the release commit
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  gates:
    name: Release gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag format, pyproject version and CHANGELOG section
        run: python scripts/release_check.py tag "${{ steps.tag.outputs.tag }}"
      - name: The tagged commit is on main (no releases from unreviewed branches)
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main

  build:
    name: Build, check and attest
    needs: [ci, gates]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # build provenance
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gates.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the static dashboard shipped in the wheel
        working-directory: frontend
        run: npm ci && npm run build:static
      - name: Build once
        run: |
          python -m pip install -q build "twine>=7"  # twine 6 cannot read Metadata-Version 2.5
          python -m build --outdir dist .
          twine check --strict dist/*
      - name: Artifact contents and SHA256SUMS
        # the dashboard in the wheel must have been rebuilt from this very commit
        run: python scripts/release_check.py artifacts dist "${{ needs.gates.outputs.tag }}" "$(git rev-parse HEAD)"
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*.whl, dist/*.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: [gates, build]
    if: ${{ github.event_name == 'push' || !inputs.dry_run }}
    runs-on: ubuntu-latest
    # Protection rules (required reviewers) are configured on this environment in the
    # repository settings; see docs/RELEASING.md.
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The files are the ones that were checked and attested
        run: |
          cd dist && sha256sum --check --strict SHA256SUMS
          test "$(find . -maxdepth 1 -type f ! -name SHA256SUMS | wc -l)" -eq 2
      - name: Remove the checksum file from the upload set
        run: rm dist/SHA256SUMS
      # Trusted publishing (OIDC) when the PyPI project is configured for it; otherwise the
      # PYPI_TOKEN secret. See docs/RELEASING.md.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}

  github-release:
    name: GitHub Release
    needs: [gates, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gates.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ needs.gates.outputs.tag }}
        run: |
          python - "${TAG#v}" <<'PY'
          import re, sys
          from pathlib import Path
          v = sys.argv[1]
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          m = re.search(rf"^## .*\b{re.escape(v)}\b.*$\n(.*?)(?=^## |\Z)", text, re.S | re.M)
          Path("release_notes.md").write_text((m.group(1).strip() if m else f"Release v{v}.") + "\n")
          PY
      - uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2
        with:
          tag_name: ${{ needs.gates.outputs.tag }}
          name: PANOPTIS ${{ needs.gates.outputs.tag }}
          body_path: release_notes.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
