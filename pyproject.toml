[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentwatch-ai"
version = "0.2.0"
description = "The Reliability, Safety, and Observability Layer for AI Agents"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.13"
authors = [
  { name = "AgentWatch Contributors" }
]
keywords = ["ai", "agents", "observability", "safety", "llm", "langchain", "claude"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Monitoring",
]

dependencies = [
  "fastapi>=0.119.0,<1.0.0",
  "uvicorn[standard]>=0.33.0,<1.0.0",
  "pydantic>=2.11.0,<3.0.0",
  "pydantic-settings>=2.5.0,<3.0.0",
  "sqlalchemy[asyncio]>=2.0.35,<3.0.0",
  "asyncpg>=0.29.0,<1.0.0",
  "redis[hiredis]>=5.3.0,<6.0.0",
  "celery[redis]>=5.5.0,<6.0.0",
  "httpx>=0.28.0,<1.0.0",
  "typer[all]>=0.12.0,<1.0.0",
  "rich>=13.9.0,<14.0.0",
  "shellingham>=1.5.0,<2.0.0",
  "python-multipart>=0.0.12,<1.0.0",
  "mcp>=1.0.0,<2.0.0",
  "prometheus-client>=0.21.0,<1.0.0",
  "litellm>=1.0.0,<2.0.0",
  "tenacity>=8.0.0,<10.0.0",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
embeddings = [
  "sentence-transformers>=3.1.0",
  "numpy>=1.26.0",
]
otel = [
  "opentelemetry-proto>=1.27.0",
  "opentelemetry-sdk>=1.27.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
  "opentelemetry-semantic-conventions>=0.48b0",
]
crypto = [
  "cryptography>=43.0.1",
  # RS256 verification of premium entitlement tokens (SAF / CMP licensing).
  "pyjwt>=2.8.0",
]
redaction = [
  # Richer NER-based PII/PHI detection; the redactor falls back to regex
  # (governance gdpr/hipaa patterns) when these are not installed.
  "presidio-analyzer>=2.2.0",
  "presidio-anonymizer>=2.2.0",
]
langchain = [
  "langchain-core>=0.3.0",
]
autogpt = [
  # AutoGPT adapter works standalone; install AutoGPT separately
]
openclaw = [
  # OpenClaw adapter works standalone; install AutoGPT separately
]
docs = [
  "mkdocs>=1.6.0",
  "mkdocs-material>=9.5.0",
  "mkdocstrings[python]>=0.26.0",
]
postgres = [
  # synchronous driver used by the v3 store (SQLAlchemy Core) in server mode
  "psycopg[binary]>=3.2.0,<4.0.0",
]
dev = [
  "psycopg[binary]>=3.2.0,<4.0.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "mypy>=1.11.0",
  "ruff>=0.6.0",
  "openai>=1.0.0",
  "httpx>=0.28.0",
  "opentelemetry-sdk>=1.27.0",
]
all = [
  "agentwatch-ai[embeddings,otel,crypto,langchain,postgres]",
]

[project.scripts]
agentwatch = "agentwatch.cli.main:main"

[project.urls]
Homepage = "https://github.com/sreerevanth/AgentWatch"
Repository = "https://github.com/sreerevanth/AgentWatch"
Issues = "https://github.com/sreerevanth/AgentWatch/issues"

[tool.hatch.build.targets.wheel]
packages = ["agentwatch"]

[tool.pytest.ini_options]
cache_dir = ".pytest_cache"
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short --basetemp=.pytest-tmp"
pythonpath = ["."]
markers = [
    "external: needs external provider credentials; reported as SKIPPED_EXTERNAL_CREDENTIAL without them",
]

[tool.ruff]
cache-dir = ".ruff_cache"
target-version = "py312"
line-length = 100

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S"]
ignore = [
  "E501",   # line too long — handled by formatter
  "S101",   # assert — fine in tests
  "S104",   # hardcoded 0.0.0.0 — intentional in server code
  "S202",   # tarfile.extractall — needed for rollback restore
  "UP042",  # StrEnum — str+Enum is more explicit for Pydantic compat
]

[tool.ruff.lint.per-file-ignores]
# __init__.py re-exports: wildcard imports and implicit re-exports are intentional
# (F405: __all__ names resolve through those wildcards).
"agentwatch/**/__init__.py" = ["F401", "F403", "F405"]
"agentwatch/*/__init__.py"  = ["F401", "F403", "F405"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
