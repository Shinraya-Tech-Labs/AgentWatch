[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "panoptis"
version = "0.4.1"
description = "PANOPTIS (formerly AgentWatch): Pre-Execution Guardrail & Observability Layer for AI Agents"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [
  { name = "PANOPTIS Contributors" }
]
keywords = ["ai", "agents", "observability", "safety", "llm", "langchain", "claude"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Monitoring",
]

dependencies = [
  "fastapi>=0.162.0,<1.0.0",
  # imported directly (middleware, MCP gateway HTTP transport); >=1.3.1 for PYSEC-2026-161/248/249/2280/2281
  "starlette>=1.3.1,<2.0.0",
  # transitive (huggingface-hub, litellm): security floor for GHSA-v4x8-3wr5-3wq8 and 12 related advisories
  "filelock>=4.2.1",
  "uvicorn[standard]>=0.33.0,<1.0.0",
  "pydantic>=2.11.0,<3.0.0",
  "pydantic-settings>=2.5.0,<3.0.0",
  "sqlalchemy[asyncio]>=2.0.35,<3.0.0",
  "asyncpg>=0.29.0,<1.0.0",
  "redis[hiredis]>=5.3.0,<6.0.0",
  "celery[redis]>=5.5.0,<6.0.0",
  "httpx>=0.28.0,<1.0.0",
  "typer>=0.12.0,<0.28.0",  # 0.28 vendors click with a new parameter model (CLI surface test); rich and shellingham are declared below (typer[all] no longer exists)
  "rich>=13.9.0,<14.0.0",
  "shellingham>=1.5.0,<2.0.0",
  "python-multipart>=0.0.12,<1.0.0",
  "mcp>=1.8.0,<2.0.0",  # Streamable HTTP; the gateway tests use the SDK client and server
  "prometheus-client>=0.21.0,<1.0.0",
  "litellm>=1.0.0,<2.0.0",
  "tenacity>=8.0.0,<9.0.0",
  "PyYAML>=6.0,<7.0",
  "jsonschema>=4.20.0,<5.0.0",
  "cryptography>=42.0.0",
]

[project.optional-dependencies]
embeddings = [
  "sentence-transformers>=3.1.0",
  "numpy>=1.26.0",
]
otel = [
  "opentelemetry-api>=1.27.0",
  "opentelemetry-proto>=1.27.0",
  "protobuf>=5.26.0",  # google.protobuf, used to decode OTLP/protobuf
  "opentelemetry-sdk>=1.27.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
  "opentelemetry-semantic-conventions>=0.48b0",
]
crypto = [
  "cryptography>=43.0.1",
  # RS256 verification of premium entitlement tokens (SAF / CMP licensing).
  "pyjwt>=2.8.0",
]
redaction = [
  # Richer NER-based PII/PHI detection; the redactor falls back to regex
  # (governance gdpr/hipaa patterns) when these are not installed.
  "presidio-analyzer>=2.2.0",
  "presidio-anonymizer>=2.2.0",
]
langchain = [
  "langchain-core>=0.3.0",
]
autogpt = [
  # AutoGPT adapter works standalone; install AutoGPT separately
]
openclaw = [
  # OpenClaw adapter works standalone; install AutoGPT separately
]
docs = [
  "mkdocs>=1.6.0",
  "mkdocs-material>=9.5.0",
  "mkdocstrings[python]>=0.26.0",
]
reports = [
  # PDF security reports; without it reports are rendered as text
  "reportlab>=4.0.0",
]
groq = [
  "groq>=0.11.0",
]
openai-agents = [
  # enforcing integration (protect_openai_agent) and `panoptis demo live`
  "openai-agents>=0.24.0,<1.0.0",
]
discovery = [
  # running-process scan of `panoptis protect discover`; config files are scanned without it
  "psutil>=5.9.0",
]
postgres = [
  # synchronous driver used by the v3 store (SQLAlchemy Core) in server mode
  "psycopg[binary]>=3.2.0,<4.0.0",
]
dev = [
  "aiosqlite>=0.20.0",
  "psycopg[binary]>=3.2.0,<4.0.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "mypy>=1.11.0",
  "ruff>=0.6.0",
  "openai>=1.0.0",
  "openai-agents>=0.24.0,<1.0.0",
  "httpx>=0.28.0",
  "opentelemetry-sdk>=1.27.0",
  "psutil>=5.9.0",
]
all = [
  "panoptis[embeddings,otel,crypto,langchain,postgres,discovery]",
]

[project.scripts]
panopti = "panopti.cli:main"
panoptis = "panoptis.cli.main:main"

[project.urls]
Homepage = "https://shinraya-tech-labs.github.io/AgentWatch/"
Repository = "https://github.com/Shinraya-Tech-Labs/AgentWatch"
Issues = "https://github.com/Shinraya-Tech-Labs/AgentWatch/issues"

[tool.hatch.build.targets.wheel]
packages = ["panoptis", "panopti"]
# the static dashboard (`cd frontend && npm run build:static`) is build output, ignored by
# git, and shipped in the wheel when present; CI and the release build it first
artifacts = ["panoptis/_dashboard/**"]

# The source distribution holds the packages, their tests and the project files only:
# not the dashboard, the landing site (a separate repository), deployment files or notes.
[tool.hatch.build.targets.sdist]
# `python -m build` makes the wheel from the sdist, so the built dashboard rides in both
artifacts = ["panoptis/_dashboard/**"]
include = [
  "/panoptis",
  "/panopti",
  "/tests",
  "/scripts/check_imports.py",
  "/pyproject.toml",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
]
exclude = ["**/__pycache__", "**/*.pyc", "/tests/**/node_modules"]

[tool.pytest.ini_options]
cache_dir = ".pytest_cache"
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short --basetemp=.pytest-tmp"
pythonpath = ["."]
markers = [
    "external: needs external provider credentials; reported as SKIPPED_EXTERNAL_CREDENTIAL without them",
]

[tool.ruff]
cache-dir = ".ruff_cache"
target-version = "py312"
line-length = 100

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S"]
ignore = [
  "E501",   # line too long — handled by formatter
  "S101",   # assert — fine in tests
  "S104",   # hardcoded 0.0.0.0 — intentional in server code
  "S202",   # tarfile.extractall — needed for rollback restore
  "UP042",  # StrEnum — str+Enum is more explicit for Pydantic compat
]

[tool.ruff.lint.per-file-ignores]
# __init__.py re-exports: wildcard imports and implicit re-exports are intentional
# (F405: __all__ names resolve through those wildcards).
"panoptis/**/__init__.py" = ["F401", "F403", "F405"]
"panoptis/*/__init__.py"  = ["F401", "F403", "F405"]
# uppercase properties are the legacy Colors API, kept for compatibility
"panopti/themes.py" = ["N802"]
# notebook cells import where they are used
"*.ipynb" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
