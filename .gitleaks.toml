# Secret scanning (gitleaks). CI fails on any finding not allowlisted here.
#
# Allowlisted: build and cache output, and test files whose fake credentials exist to test
# redaction and detection. Every entry is a named file, not a directory, so a real secret
# added anywhere else in tests/ is still caught.
title = "AgentWatch gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "build output, caches and named test fixtures"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)\.next/''',
  '''(^|/)__pycache__/''',
  '''\.pyc$''',
  '''(^|/)\.venv/''',
  '''^agentwatch-landing/''',  # a separate repository with its own scanning
  '''^benchmarks/governance_suite\.py$''',
  '''^benchmarks/protect_eval/''',
  '''^benchmarks/results/protect_eval/''',
  '''^tests/security/test_secret_redactor\.py$''',
  '''^tests/protect/test_academic_frontier\.py$''',
  '''^tests/protect/test_claude_hook\.py$''',
  '''^tests/protect/test_discovery\.py$''',
  '''^tests/protect/test_enforce\.py$''',
  '''^tests/protect/test_framework_integrations\.py$''',
  '''^tests/protect/test_generic_and_direct\.py$''',
  '''^tests/protect/test_mcp_gateway\.py$''',
  '''^tests/protect/mcp_fixtures/fake_server\.py$''',
  '''^tests/protect/test_output_inspection\.py$''',
  '''^tests/protect/test_protect_tool\.py$''',
  '''^tests/protect/test_threat_analysis\.py$''',
  '''^tests/test_tasks_and_alerting\.py$''',
  '''^tests/test_tenancy_resolver\.py$''',
  '''^tests/v3/test_evidence\.py$''',
]
# AWS's documented example key, used as a fixture in several tests; the walkthrough's
# synthetic tenant keys (examples/walkthrough), which only exist for its local deployment
regexes = [
  '''AKIAIOSFODNN7EXAMPLE''',
  '''walkthrough-key-(acme|globex)''',
  '''FAKEfakeFAKEfakeFAKEfakeFAKEfakeFAKEfake''',
  '''ghp_[a-zA-Z0-9]+''',
]
